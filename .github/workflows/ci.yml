name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all Python files
        run: |
          python -m compileall -q src hooks benchmarks tests

      - name: Run zero-dependency unittest suite
        run: |
          python -m unittest discover -s tests -v

      - name: Verify CLI --explain --pretty (Antigravity + Claude Code)
        shell: bash
        env:
          PYTHONPATH: src
          MODEL_ROUTER_DISABLE_GLOBAL_CONFIG: "1"
        run: |
          python -m model_router --explain --pretty \
            --name "neon-xray" \
            --model "gemini-4-neon-high" \
            --brief "@neon-xray [neon-dyad] Run full-repo Parquet ablation across state-space filters."
          python -m model_router --explain --pretty \
            --preset claude-code \
            --harness claude-code \
            --name "commit-crew" \
            --model "opus" \
            --brief "@commit-crew [grunt-low] Stage and git commit."

      - name: Run latency benchmark with p99 gate
        run: |
          python benchmarks/bench_router.py --assert-p99-ms 50.0

  typecheck:
    name: Strict Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy

      - name: Run mypy --strict
        run: |
          mypy --strict src
