[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router"
version = "0.1.0"
description = "Zero-dependency PreToolUse/PostToolUse subagent router, dual-window quota state machine, and parent-context edit-budget guard for Claude Code, Google Antigravity, and multi-agent harnesses (0 LLM tokens, pure Python stdlib)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Zac de Lusignan" }]
keywords = [
    "antigravity",
    "claude-code",
    "multi-agent",
    "model-routing",
    "llm-orchestration",
    "hooks",
    "quota-management",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lusignan/model-router"
Repository = "https://github.com/lusignan/model-router"
Issues = "https://github.com/lusignan/model-router/issues"

[project.scripts]
model-router = "model_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_router = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = "src"

[tool.ruff]
target-version = "py39"
line-length = 110
src = ["src", "tests", "benchmarks", "hooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
